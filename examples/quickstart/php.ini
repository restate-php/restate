; Settings every Restate endpoint needs (docs/serving.md#php-settings).

; Anything PHP prints would corrupt the response Restate reads: log warnings instead of displaying them.
display_errors = Off
log_errors = On

; Restate sends the journal as the request body; the SDK reads it itself.
enable_post_data_reading = 0

; PHP 8.6's built-in server checks post_max_size itself, even with enable_post_data_reading=0.
post_max_size = 0
