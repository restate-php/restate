version: 2

updates:
  - package-ecosystem: cargo
    directory: /extension
    schedule:
      interval: daily
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: daily
    groups:
      composer:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: daily
    groups:
      github-actions:
        patterns:
          - "*"
