version: 2

# Weekly: every update pull request runs the whole CI (about 25 jobs).
updates:
  - package-ecosystem: cargo
    directory: /extension
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # The base images of the endpoint, test-service and quickstart images. Not the compose files:
  # their Restate image is RestateContainer::DEFAULT_IMAGE, which CI checks them against, so it
  # moves with the harness. The FrankenPHP images that ci.yaml's matrix names per PHP minor are
  # bumped by hand with the Dockerfile's.
  - package-ecosystem: docker
    directories:
      - /docker
      - /examples/quickstart
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
