version: 2

# Weekly: every update pull request runs the whole CI (about 25 jobs).
updates:
  - package-ecosystem: cargo
    directory: /extension
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # The base images of the endpoint, test-service and quickstart images: Dependabot reads FROM lines
  # only, so docker/*/Dockerfile name their bases in stages of their own, one per PHP minor
  # (frankenphp-<minor>, php-fpm-<minor>, php-cli-<minor>), which docker-bake.hcl picks by name.
  # Not the compose files: their Restate image is RestateContainer::DEFAULT_IMAGE, which the unit
  # suite checks them against, so it moves with the harness.
  - package-ecosystem: docker
    directories:
      - /docker/*
      - /examples/quickstart
      # nixos/nix, which builds the extension module (extension/Dockerfile).
      - /extension
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      # Each php stage is one PHP minor on purpose (php-cli-8.4 is php:8.4-cli-bookworm).
      - dependency-name: php
        update-types: [version-update:semver-major, version-update:semver-minor]
