version: 2

# Weekly: every update pull request runs the whole CI (about 25 jobs).
updates:
  - package-ecosystem: cargo
    directory: /extension
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    groups:
      composer:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  # The base images of the endpoint, test-service and quickstart images: Dependabot reads FROM lines
  # only, so docker/Dockerfile names its default bases in *-default stages. Not the compose files:
  # their Restate image is RestateContainer::DEFAULT_IMAGE, which the unit suite checks them
  # against, so it moves with the harness. The FrankenPHP images that ci.yaml's matrix names per
  # PHP minor are bumped by hand with the Dockerfile's.
  - package-ecosystem: docker
    directories:
      - /docker
      - /examples/quickstart
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      # PHP 8.4 is the oldest supported minor, which the images build against by default; the
      # newer ones are --build-arg overrides (ci.yaml).
      - dependency-name: php
        update-types: [version-update:semver-major, version-update:semver-minor]
