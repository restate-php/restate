name: Set up Composer cache
description: >-
  Pin Composer's download cache to a fixed path and restore it. The path reaches the dev shell
  through `COMPOSER_CACHE_DIR`, so `devenv shell -- composer install` uses it.

runs:
  using: composite

  steps:
    # Pin Composer's cache to the path cached below, whatever the runner image sets.
    - name: Set the Composer cache directory
      shell: bash
      run: echo "COMPOSER_CACHE_DIR=$HOME/.cache/composer" >> "$GITHUB_ENV"

    - name: Restore the Composer cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/composer
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
        restore-keys: composer-${{ runner.os }}-
