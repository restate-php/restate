# The PHP micro-benchmarks (tests/Benchmark, phpbench) of a pull request against its base.
#
# Not a gate: the job is continue-on-error, since wall-clock numbers on shared GitHub runners
# move by noise alone.
name: Benchmarks (PHP)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  compare:
    name: PHP benchmarks, head vs base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base revision is checked out as a worktree next to the head.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: bench

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Writes the comparison to the job summary; exits 1 when a benchmark regressed in both pairs.
      - name: Compare with the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: just bench-compare --base "$BASE_SHA"

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-compare
          path: |
            var/bench/compare/*.xml
            var/bench/compare/*.tsv
            var/bench/compare/report.*
          if-no-files-found: ignore
