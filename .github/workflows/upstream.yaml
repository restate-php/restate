# The upstream Restate SDK test suite (restatedev/e2e sdk-tests.jar) against the PHP test
# services, through the action the official SDKs use. Locally: just test upstream.
name: Upstream SDK tests

on:
  push:
    branches: [main]
    paths: &paths
      - '.github/workflows/upstream.yaml'
      - 'composer.json'
      - 'composer.lock'
      - 'docker/**'
      - 'extension/**'
      - 'packages/**'
      - 'test-services/**'
  pull_request:
    paths: *paths
  workflow_dispatch:
  # The release (.github/workflows/release.yaml) runs it on the commit it releases, and the
  # nightly serving tests (nightly-serving.yaml) against php-fpm behind nginx.
  workflow_call:
    inputs:
      target:
        description: The docker/Dockerfile target of the test services
        type: string
        default: upstream-frankenphp

# Inside a called workflow github.workflow is the caller's name, so the group names this
# workflow itself; manual runs and the release's call (workflow_dispatch) get a group of their
# own and are never cancelled by a push.
concurrency:
  group: upstream-${{ inputs.target || 'upstream-frankenphp' }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TARGET: ${{ inputs.target || 'upstream-frankenphp' }}
  SERVICE_IMAGE: restate.local/restate-php-test-services:${{ inputs.target || 'upstream-frankenphp' }}

jobs:
  sdk-tests:
    name: restatedev/e2e sdk-tests (${{ inputs.target || 'upstream-frankenphp' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # contents: read checks out the repository. The action publishes the JUnit results as a check
    # run and a pull request comment (EnricoMi/publish-unit-test-result-action), hence checks and
    # pull-requests write; issues: read lets it find its earlier comment when the repository is
    # private and is harmless in a public one.
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The integration harness's Restate (RestateContainer::DEFAULT_IMAGE).
      - name: Read the Restate image
        run: |
          image=$(sed -n "s/^ *public const string DEFAULT_IMAGE = '\(.*\)';$/\1/p" packages/testing/src/RestateContainer.php)
          if [ -z "$image" ]; then
            echo "::error file=packages/testing/src/RestateContainer.php::No DEFAULT_IMAGE"
            exit 1
          fi
          echo "RESTATE_IMAGE=$image" >> "$GITHUB_ENV"

      # Images tagged restate.local/* are never pulled by the suite, so it uses this build.
      - name: Build the test-services image
        run: docker build --target "$TARGET" -f docker/Dockerfile -t "$SERVICE_IMAGE" .

      # Pinned by tag, not by commit: the action downloads sdk-tests.jar from the release named
      # after the ref it runs at (github.action_ref), so a SHA pin breaks the download. Upstream
      # has moved the v2.3 tag after the release (the jar asset stayed the same); locally
      # bin/conformance-upstream-local.sh pins the jar by SHA-256.
      - name: Run the upstream SDK tests
        uses: restatedev/e2e/sdk-tests@v2.3
        with:
          serviceContainerImage: ${{ env.SERVICE_IMAGE }}
          restateContainerImage: ${{ env.RESTATE_IMAGE }}
          exclusionsFile: test-services/exclusions.yaml
          testArtifactOutput: ${{ env.TARGET }}-sdk-tests-report

      # A suite that cannot start (for example, no test matches) reports nothing and exits 0.
      - name: Fail when no tests ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = sum(int(ET.parse(f).getroot().get("tests", 0)) for f in glob.glob("test-report/*/*.xml"))
          print(f"{total} tests ran")
          sys.exit(0 if total > 0 else 1)
          PY
