# Prebuilt binaries of the Restate PHP extension for PIE (`pie install restate/ext-restate`):
# one gzipped tar per PHP minor x thread safety x CPU x libc, named as PIE looks for it.
# docs/decisions/0030-prebuilt-extension-binaries.md has the design.
#
# A job per CPU cross-compiles all of them with Nix in the dev shell (`just extension pie`, the
# extension flake's packages.pie, extension/flake.nix), which also checks each module's shared
# libraries and glibc floor, and checks the flake. The x86_64 job's archives are the ones kept;
# the arm64 job builds the same for restate-php.cachix.org, because Nix caches a build per system
# it runs on: an aarch64-linux Nix (Docker on an Apple silicon Mac, an arm64 Linux machine) finds
# nothing an x86_64 runner built, even for the same target. Each job also builds the modules the
# Docker-based suites use for its own CPU. Then a job per CPU loads each archive of that CPU into
# a clean PHP and runs extension/tests/*.phpt there, and a macOS job runs the flake's checks on
# macOS. Keeps the archives as a workflow artifact; it never publishes anything.
# Runs on changes to the extension or its build, by hand, and as part of a release:
# .github/workflows/release.yaml calls it and publishes the archives it builds.
name: Extension binaries

on:
  push:
    branches: [main]
    paths: &paths
      - '.github/workflows/extension.yaml'
      - 'extension/**'
  pull_request:
    paths: *paths
  workflow_dispatch:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Pushes the Nix builds to restate-php.cachix.org
        required: false
    outputs:
      version:
        description: The extension version the archives are named after (the crate version)
        value: ${{ jobs.version.outputs.version }}

# Inside a called workflow github.workflow is the caller's name, so the group names this
# workflow itself; manual runs and the release's call (workflow_dispatch) get a group of their
# own and are never cancelled.
concurrency:
  group: extension-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: Extension version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The crate version (extension/extension/Cargo.toml): what the module reports
      # and PIE puts in the asset names. The release checks it is the version it releases.
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' extension/extension/Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No version in extension/extension/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build the archives on ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Every target on this runner (just extension pie: nix build ./extension#pie). An earlier
      # run's archives and modules for the same sources and runner CPU come from
      # restate-php.cachix.org, the rest are built here and pushed there.
      - name: Build the archives
        run: just extension pie dist

      - name: Check the archives
        run: |
          ls -l dist
          count=$(grep -c "  php_restate-${VERSION}_" dist/SHA256SUMS)
          if [ "$count" != 24 ]; then
            echo "::error::Expected 24 archives of $VERSION, built $count"
            exit 1
          fi

      # The builds of the Docker-based suites that are not in the archives, for this runner's CPU
      # and every PHP minor, for restate-php.cachix.org: debug NTS (php-fpm) and ZTS (FrankenPHP),
      # and the soak suite's diagnostics builds (FrankenPHP, debug and release).
      - name: Build the Docker suites' modules
        run: |
          target=$(uname -m)-linux-glibc
          modules=()
          for php in $(nix eval --raw ./extension#extensions --apply 'extensions: toString (builtins.attrNames extensions)'); do
            modules+=(
              "./extension#extensions.$php.nts.$target.debug"
              "./extension#extensions.$php.zts.$target.debug"
              "./extension#extensions.$php.zts.$target.debug-diagnostics"
              "./extension#extensions.$php.zts.$target.release-diagnostics"
            )
          done
          nix build --no-link -L "${modules[@]}"

      # The flake restate-php/ext-restate publishes (the split of extension/): every system's
      # outputs evaluate, and its checks pass on this one: tests/*.phpt with PHP 8.4, 8.5 and 8.6
      # and with a ZTS PHP (the extension loaded through its overlay), and an invocation per
      # request in FrankenPHP's workers and PHP-FPM's children (tests/server/).
      - name: Check the flake
        run: nix flake check -L ./extension

      # One artifact with every archive, the x86_64 job's: the release downloads php_restate-*.
      - name: Upload the archives
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php_restate-${{ needs.version.outputs.version }}
          path: |
            dist/*.tgz
            dist/*.sha256
          if-no-files-found: error

  # On a runner of each CPU: every archive's checksum, then each archive loaded into a clean PHP
  # of its version, thread safety and C library, with the module alone (php -n), running
  # extension/tests/*.phpt there. The Nix build already checked each module's shared libraries
  # (only the C library: PIE cannot install others) and its glibc floor.
  verify:
    name: Load the ${{ matrix.arch }} archives
    needs: [version, build]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Plain Nix for the flake (extension/flake.lock), without the whole dev shell.
      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Use the binary caches
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: restate-php
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php_restate-${{ needs.version.outputs.version }}
          path: dist

      - name: Check the checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256

      # The flake's load-test (ext-php-rs.nix's loadPieArchives): each archive of this CPU in the
      # official image of its PHP minor, thread safety (cli or zts) and C library (Debian trixie
      # or Alpine), which is what a user's container has. It fails on a name it cannot parse, so
      # it also checks the names PIE matches exactly. PHP 8.6's official images are ZTS only
      # (`8.6-cli-*` is ZTS, there is no `8.6-zts-*`): it skips the 8.6 NTS archives.
      - name: Load into PHP's official images
        run: nix run ./extension#load-test -- --arch "$ARCH" dist extension/tests

      # No official NTS image of PHP 8.6: nixpkgs' PHP 8.6 (NTS, glibc), at the nixpkgs the
      # archives were built with, runs the same tests with its own run-tests.php. Nothing packages
      # an NTS PHP 8.6 for musl yet, so the 8.6 NTS musl archives are not loaded anywhere.
      - name: Load the PHP 8.6 NTS glibc archive into nixpkgs' PHP 8.6
        run: |
          rev=$(jq -r .nodes.nixpkgs.locked.rev extension/flake.lock)
          php="github:NixOS/nixpkgs/$rev#php86"
          work=$(mktemp -d)
          tar -xzf "dist/php_restate-${VERSION}_php8.6-${ARCH}-linux-glibc-nts.tgz" -C "$work"
          tar -xf "$(nix build --no-link --print-out-paths "$php.unwrapped.src")" -C "$work" --strip-components=1 --wildcards '*/run-tests.php'
          cp -r extension/tests "$work/tests"
          bin=$(nix build --no-link --print-out-paths "$php")/bin
          load=(-n -d "extension=$work/restate.so")
          # PHP must start without a word: a module that does not load only warns, and a test that
          # names it in --EXTENSIONS-- would then be skipped, not failed.
          out=$("$bin/php" "${load[@]}" -r '' 2>&1) || { printf '%s\n' "$out"; exit 1; }
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            echo "::error::PHP 8.6 did not start cleanly with the module"
            exit 1
          fi
          NO_INTERACTION=1 REPORT_EXIT_STATUS=1 "$bin/php" "$work/run-tests.php" -P -q --show-diff "${load[@]}" "$work/tests"

  # The flake's checks on macOS (arm64), where nixpkgs' PHP loads the module built for it, as Nix
  # users on a Mac do: tests/*.phpt with PHP 8.4, 8.5 and 8.6 and with a ZTS PHP, FrankenPHP's
  # workers and PHP-FPM's children. GitHub's macOS runners have no Docker; these need none.
  flake-macos:
    name: Check the flake on macOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Use the binary caches
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: restate-php
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check the flake
        run: nix flake check -L ./extension
