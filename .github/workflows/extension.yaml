name: Extension

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Pushes the Nix builds to restate-php.cachix.org
        required: false
    outputs:
      version:
        description: The extension version the archives are named after (the crate version)
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The crate version (extension/extension/Cargo.toml): what the module reports
      # and PIE puts in the asset names. The release checks it is the version it releases.
      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' extension/extension/Cargo.toml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::No version in extension/extension/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    defaults:
      run:
        shell: devenv shell -- bash -e {0}
    env:
      VERSION: ${{ needs.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build the archives
        run: just extension pie dist

      - name: Check the archives
        run: |
          ls -l dist
          count=$(grep -c "  php_restate-${VERSION}_" dist/SHA256SUMS)
          if [ "$count" != 24 ]; then
            echo "::error::Expected 24 archives of $VERSION, built $count"
            exit 1
          fi

      # The builds of the Docker-based suites that are not in the archives, for this runner's CPU
      # and every PHP minor, for restate-php.cachix.org: debug NTS (php-fpm) and ZTS (FrankenPHP),
      # and the soak suite's diagnostics builds (FrankenPHP, debug and release).
      - name: Build the Docker suites' modules
        run: |
          target=$(uname -m)-linux-glibc
          modules=()
          for php in $(nix eval --raw ./extension#extensions --apply 'extensions: toString (builtins.attrNames extensions)'); do
            modules+=(
              "./extension#extensions.$php.nts.$target.debug"
              "./extension#extensions.$php.zts.$target.debug"
              "./extension#extensions.$php.zts.$target.debug-diagnostics"
              "./extension#extensions.$php.zts.$target.release-diagnostics"
            )
          done
          nix build --no-link -L "${modules[@]}"

      # The flake restate-php/ext-restate publishes (the split of extension/): every system's
      # outputs evaluate, and its checks pass on this one: tests/*.phpt with PHP 8.4, 8.5 and 8.6
      # and with a ZTS PHP (the extension loaded through its overlay), and an invocation per
      # request in FrankenPHP's workers and PHP-FPM's children (tests/server/).
      - name: Check the flake
        run: nix flake check -L ./extension

      # One artifact with every archive, the x86_64 job's: the release downloads php_restate-*.
      - name: Upload the archives
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: php_restate-${{ needs.version.outputs.version }}
          path: |
            dist/*.tgz
            dist/*.sha256
          if-no-files-found: error

  # On a runner of each CPU: every archive's checksum, then each archive loaded into a clean PHP
  # of its version, thread safety and C library, with the module alone (php -n), running
  # extension/tests/*.phpt there. The Nix build already checked each module's shared libraries
  # (only the C library: PIE cannot install others) and its glibc floor.
  verify:
    name: Verify (${{ matrix.arch }})
    needs: [version, build]
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    env:
      ARCH: ${{ matrix.arch }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Plain Nix for the flake (extension/flake.lock), without the whole dev shell.
      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Use the binary caches
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: restate-php
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Download the archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: php_restate-${{ needs.version.outputs.version }}
          path: dist

      - name: Check the checksums
        working-directory: dist
        run: sha256sum -c ./*.sha256

      # The flake's load-test (ext-php-rs.nix's loadPieArchives): each archive of this CPU in the
      # official image of its PHP minor, thread safety (cli or zts; for PHP 8.6, whose cli images
      # are ZTS, nts or zts) and C library (Debian trixie or Alpine), which is what a user's
      # container has. It fails on a name it cannot parse, so it also checks the names PIE matches
      # exactly.
      - name: Load into PHP's official images
        run: nix run ./extension#load-test -- --arch "$ARCH" dist extension/tests

  # The flake's checks on macOS (arm64), where nixpkgs' PHP loads the module built for it, as Nix
  # users on a Mac do: tests/*.phpt with PHP 8.4, 8.5 and 8.6 and with a ZTS PHP, FrankenPHP's
  # workers and PHP-FPM's children. GitHub's macOS runners have no Docker; these need none.
  flake-macos:
    name: Check the flake on macOS
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Use the binary caches
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: restate-php
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check the flake
        run: nix flake check -L ./extension
