# Benchmarks of the extension's Rust core (TESTING.md, Performance), through
# the extension module's bench recipes (extension/justfile) in the dev shell:
#
# - On pull requests that touch the extension: instruction counts (gungraun, under callgrind)
#   of the pull request against its base branch, built in a worktree in the same job, with a
#   regression limit of +2% instructions, and the replay linearity check. Informational
#   (continue-on-error), not a gate.
# - Nightly and by hand: the instruction counts of the branch, and criterion's wall-clock
#   times as an artifact. Report only: shared runners vary too much for wall-clock gates.
name: Extension benchmarks

on:
  pull_request:
    paths:
      - '.github/workflows/bench-extension.yaml'
      - 'extension/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: bench-extension-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  compare:
    name: Instruction counts against the base branch
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Not a gate: a regression shows in the job summary without failing the pull request.
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base branch's history, for the merge-base worktree.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: restate-php
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Composer cache
        uses: ./.github/actions/composer-cache

      - name: Set up Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # extension/target/ holds both builds (the base in target/bench-base/) and the
          # gungraun-runner binary.
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            extension/target/
          key: cargo-bench-extension-${{ hashFiles('extension/Cargo.lock', 'extension/rust-toolchain.toml') }}
          restore-keys: |
            cargo-bench-extension-
            cargo-check-php8.5-

      - name: Compare with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base HEAD "origin/$BASE_REF")
          set +e
          just extension bench-compare "$base" 2>&1 | tee bench-extension.log
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "### Extension instruction counts against \`$BASE_REF\` ($(git rev-parse --short "$base"))"
            echo
            echo '```'
            grep -E '^vm_instructions::|^  Instructions:|instructions per replayed run|Regressions:|Gungraun result' bench-extension.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  nightly:
    name: Instruction counts and wall-clock times
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: restate-php
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Composer cache
        uses: ./.github/actions/composer-cache

      - name: Set up Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            extension/target/
          key: cargo-bench-extension-${{ hashFiles('extension/Cargo.lock', 'extension/rust-toolchain.toml') }}
          restore-keys: |
            cargo-bench-extension-
            cargo-check-php8.5-

      - name: Instruction counts
        run: |
          set -o pipefail
          just extension bench 2>&1 | tee bench-extension.log
          {
            echo '### Extension instruction counts'
            echo
            echo '```'
            grep -E '^vm_instructions::|^  Instructions:|instructions per replayed run' bench-extension.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wall-clock times
        run: just extension bench-criterion

      - name: Upload the criterion report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-report
          path: extension/target/criterion/
