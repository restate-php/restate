# The local suites (TESTING.md), run the way a developer runs them: in the devenv dev shell,
# through the just recipes. A job here passes exactly when its command passes locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release (.github/workflows/release.yaml) runs it on the commit it releases.
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Pushes the Nix builds to restate-php.cachix.org
        required: false

# Inside a called workflow github.workflow is the caller's name, so the group names this
# workflow itself; manual runs and the release's call (workflow_dispatch) get a group of their
# own and are never cancelled by a push.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The images' extension module is built by the runner's Nix (bin/build-image.sh), which downloads
  # it from restate-php.cachix.org for any source CI has built.
  RESTATE_PHP_IMAGE_EXTENSION: host

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  check:
    name: just check (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # The dev shell's PHP (devenv.nix `languages.php.version`, by default nixpkgs' `php`,
        # 8.5 now); the extension is built against the same PHP (devenv.nix takes php-config
        # from it).
        php: ['8.4', '8.5', '8.6']
    defaults:
      run:
        shell: devenv -O languages.php.version:string ${{ matrix.php }} shell -- bash -e {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The action builds the default shell; the Cargo cache builds the matrix PHP's.
          build-shell: false
          cargo-cache: check-php${{ matrix.php }}
          shell: devenv -O languages.php.version:string ${{ matrix.php }} shell --

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Check
        run: just check

  integration:
    name: just test integration php-cli (Restate ${{ matrix.restate }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The default is Restate\Testing\RestateContainer::DEFAULT_IMAGE (an empty
        # RESTATE_PHP_RESTATE_IMAGE); 1.7.14 is the best-effort older server (protocol v6).
        include:
          - restate: default
            image: ''
          - restate: '1.7.14'
            image: docker.restate.dev/restatedev/restate:1.7.14

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: integration

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # The harness starts Restate with the runner's Docker and serves the endpoint on the
      # host; Restate's and the endpoint's log tails are in the output of a failed test.
      - name: Test
        run: just test integration php-cli
        env:
          RESTATE_PHP_RESTATE_IMAGE: ${{ matrix.image }}

  # The integration suite on macOS, whose GitHub runners have no Docker: Restate as a process of
  # the harness (RESTATE_PHP_TEST_RESTATE=process, restate-server from the dev shell), the endpoint
  # under php -S, both on loopback (docs/decisions/0038-native-restate-for-the-test-harness.md).
  integration-macos:
    name: RESTATE_PHP_TEST_RESTATE=process just test integration php-cli (macOS)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: integration

      # The harness's defaults are tested with the image's version, which restate-bin must be.
      - name: Check restate-server against the integration harness
        run: |
          version=$(restate-server --version | awk '{ print $2 }')
          if ! grep -qF "DEFAULT_IMAGE = 'docker.restate.dev/restatedev/restate:${version}';" packages/testing/src/RestateContainer.php; then
            echo "::error file=devenv.lock::restate-server ${version} (nix-restate's restate-bin) differs from RestateContainer::DEFAULT_IMAGE"
            exit 1
          fi

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Test
        run: RESTATE_PHP_TEST_RESTATE=process just test integration php-cli

  frankenphp:
    name: just test integration frankenphp (PHP ${{ matrix.php }} ZTS)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # docker/Dockerfile's FrankenPHP base of each minor (frankenphp-<minor>).
        php: ['8.4', '8.5', '8.6']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: integration

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Builds the frankenphp-extension image (FrankenPHP's thread-safe PHP of the matrix minor, with
      # the ZTS extension module for it) and runs the integration suite against it.
      - name: Test
        run: just test integration frankenphp
        env:
          RESTATE_PHP_TEST_PHP_VERSION: ${{ matrix.php }}

  frankenphp-worker:
    name: just test integration frankenphp-worker (PHP 8.4 ZTS)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: integration

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # The frankenphp-extension image in worker mode (worker.Caddyfile, the endpoints built once
      # per worker): the integration suite, then the worker suite (tests/Worker).
      - name: Test
        run: just test integration frankenphp-worker

  fpm:
    name: just test integration ${{ matrix.server }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # php-fpm behind nginx (HTTP/1.1, h2c) and Caddy php_fastcgi (h2c), with the front-door
        # settings docs/serving.md recommends (docker/fpm/).
        server: [nginx-fpm, nginx-fpm-h2c, caddy-fpm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: integration

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Builds the fpm-extension image (the official php-fpm image with the extension module for it)
      # and runs the integration suite against php-fpm behind this matrix entry's front door.
      - name: Test
        run: just test integration ${{ matrix.server }}

  # The integration suite against an endpoint and a Restate that devenv runs, the harness only
  # connecting to them (RESTATE_PHP_TEST_RESTATE=external just test integration <server>): a devenv.nix profile serves the
  # endpoint with FrankenPHP built from the matrix PHP, with Restate next to it, on Linux and on
  # macOS, without Docker (docs/decisions/0039-external-test-environments.md). The tests that
  # start, stop or configure their environment (group `managed`) run in the jobs above.
  external:
    name: devenv test (${{ matrix.profile }}, PHP ${{ matrix.php }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        profile: [frankenphp, frankenphp-worker]
        php: ['8.4', '8.5', '8.6']
    defaults:
      run:
        shell: devenv --profile ${{ matrix.profile }} -O languages.php.version:string ${{ matrix.php }} shell -- bash -e {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The action builds the default shell; the first step builds the profile's.
          build-shell: false

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Starts the profile's processes (FrankenPHP, Restate) on a fresh state directory, waits
      # until they are ready, then runs its enterTest; their output is in the step's log.
      - name: Test
        shell: bash
        run: devenv --profile "${{ matrix.profile }}" -O languages.php.version:string "${{ matrix.php }}" test
