name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    secrets:
      CACHIX_AUTH_TOKEN:
        description: Pushes the Nix builds to restate-php.cachix.org
        required: false

permissions:
  contents: read

env:
  # The images' extension module is built by the runner's Nix (bin/build-image.sh), which downloads
  # it from restate-php.cachix.org for any source CI has built.
  RESTATE_PHP_IMAGE_EXTENSION: host

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  checks:
    name: Checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5", "8.6"]
    defaults:
      run:
        shell: devenv -O languages.php.version:string ${{ matrix.php }} shell -- bash -e {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The action builds the default shell; the Cargo cache builds the matrix PHP's.
          build-shell: false
          cargo-cache: check-php${{ matrix.php }}
          shell: devenv -O languages.php.version:string ${{ matrix.php }} shell --

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Check
        run: just check

  # The SDK's logic: the whole integration suite once, under php -S, with Restate in a container.
  # The runtime cells below run what differs between runtimes (docs/decisions/0045-test-matrix.md).
  integration:
    name: Integration (php-cli)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: integration

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Test
        run: just test integration php-cli

  # The whole integration suite on macOS, whose GitHub runners have no Docker: Restate as a process
  # of the harness (RESTATE_PHP_TEST_RESTATE=process, restate-server from the dev shell), the
  # endpoint under php -S (docs/decisions/0038-native-restate-for-the-test-harness.md).
  integration-macos:
    name: Integration (php-cli, macOS)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: integration

      # The harness's defaults are tested with the image's version, which restate-bin must be.
      - name: Check restate-server against the integration harness
        run: |
          version=$(restate-server --version | awk '{ print $2 }')
          if ! grep -qF "DEFAULT_IMAGE = 'docker.restate.dev/restatedev/restate:${version}';" packages/testing/src/RestateContainer.php; then
            echo "::error file=devenv.lock::restate-server ${version} (nix-restate's restate-bin) differs from RestateContainer::DEFAULT_IMAGE"
            exit 1
          fi

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Test
        run: RESTATE_PHP_TEST_RESTATE=process just test integration php-cli

  # Every runtime once, with the PHP minors, C libraries and CPUs spread across them rather than
  # crossed: the runtime group of the integration suite and the conformance suite (runtime.yaml).
  # nightly-runtime.yaml runs every combination.
  runtime:
    name: Runtime
    uses: ./.github/workflows/runtime.yaml
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    with:
      cells: |
        [
          {"name": "FrankenPHP (PHP 8.6, arm64)", "servers": "frankenphp", "group": "runtime", "conformance": "frankenphp", "php": "8.6", "libc": "glibc", "arch": "arm64"},
          {"name": "FrankenPHP worker (PHP 8.5)", "servers": "frankenphp-worker", "group": "runtime", "conformance": "frankenphp-worker", "php": "8.5", "libc": "glibc", "arch": "x86_64"},
          {"name": "nginx + php-fpm (PHP 8.4, Alpine)", "servers": "nginx-fpm nginx-fpm-h2c", "group": "runtime", "conformance": "fpm-nginx", "php": "8.4", "libc": "musl", "arch": "x86_64"},
          {"name": "Caddy + php-fpm (PHP 8.5, arm64)", "servers": "caddy-fpm", "group": "runtime", "conformance": "fpm-caddy", "php": "8.5", "libc": "glibc", "arch": "arm64"}
        ]
