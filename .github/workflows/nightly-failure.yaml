# Failure-injection scenarios too slow for every pull request (TESTING.md, "Failure scenarios"):
# the failure-nightly group (Restate restarts, graceful shutdowns, network faults through the fault
# proxy, request stalls, back-pressure codes, container OOM kills, expired request identity, the
# full truncation sweep) on php -S, on php-fpm behind each front door and on FrankenPHP (classic
# mode, thread-safe extension: the only server for SIGTERM to FrankenPHP). Each job runs the same
# command as locally.
name: Nightly failure

on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  failure:
    name: failure-nightly (${{ matrix.server }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: php-cli
            command: composer test:failure
          - server: nginx-fpm
            command: just test fpm --group failure-nightly
          - server: nginx-fpm-h2c
            command: just test fpm --group failure-nightly
          - server: caddy-fpm
            command: just test fpm --group failure-nightly
          # Builds the frankenphp-extension image (the extension compiled against FrankenPHP's
          # thread-safe PHP), then runs the group against it.
          - server: frankenphp
            command: just test frankenphp --group failure-nightly

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: integration

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run the failure-nightly group
        run: ${{ matrix.command }}
        env:
          RESTATE_PHP_TEST_SERVER: ${{ matrix.server }}
