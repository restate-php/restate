# Load tests (TESTING.md, Load tests): bin/load-test.sh --full runs the compose project
# tests/load/compose.yaml (Restate signing its requests and the release FrankenPHP endpoint) and k6
# against it, at open-model arrival rates.
#
# Needs a dedicated self-hosted runner with the label `restate-php-load`: shared GitHub runners
# are too noisy for CPU-per-invocation numbers, and results only compare with earlier results
# from the same machine. The runner needs Docker with compose on cgroup v2, Nix is installed by the
# setup-devenv action, and nothing else may run on it during a job (turbo boost off and the
# performance governor make the numbers steadier). A run fails only on its checks (a 401,
# unexpected attempts, failed calls); its result files are kept as the job's artifact, for
# comparing by hand.
#
# The workflow runs only by hand (workflow_dispatch; all scenarios take about 20 min). With the
# commented-out schedule enabled, a scheduled run picks one scenario per night by day of year
# (6 scenarios, so each one every 6 nights).
name: Load tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario (noop, state, runs, fanout, long-journal, overload) or "all"'
        required: true
        default: all
  # schedule:
  #   - cron: '17 2 * * *'

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  load:
    name: bin/load-test.sh ${{ inputs.scenario || 'rotation' }}
    runs-on: [self-hosted, restate-php-load]
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: restate-php
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Composer cache
        uses: ./.github/actions/composer-cache

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run
        env:
          EVENT: ${{ github.event_name }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          scenarios=(noop state runs fanout long-journal overload)
          if [ "$EVENT" = schedule ]; then
            SCENARIO=${scenarios[$((10#$(date -u +%j) % ${#scenarios[@]}))]}
          fi
          bash bin/load-test.sh "$SCENARIO" --full

      # The project outlives a cancelled run otherwise, on a runner that keeps its Docker state.
      - name: Remove the compose project
        if: always()
        run: bash bin/load-test.sh down

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-results
          path: var/load/results/
          if-no-files-found: ignore
