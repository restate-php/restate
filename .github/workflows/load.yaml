# Load tests (TESTING.md, Performance): bin/load-test.sh against a fresh Restate that signs its
# requests and the release FrankenPHP endpoint, driven by k6 with open-model arrival rates.
#
# Needs a dedicated self-hosted runner with the label `restate-php-load`: shared GitHub runners
# are too noisy for CPU-per-invocation numbers, and results only compare with earlier results
# from the same machine. The runner needs Docker (or podman) on cgroup v2, Nix is installed by the
# setup-devenv action, and nothing else may run on it during a job (turbo boost off and the performance
# governor make the numbers steadier). Results accumulate in $LOAD_RESULTS_DIR on the runner
# (repository variable LOAD_RESULTS_DIR, default ~/restate-php-load-results): the rolling median
# compares with the last 5 results there. A result is also compared with a pinned baseline,
# tests/Load/baselines/<scenario>.json, when that file exists (a result file copied there by
# hand); none is committed, so by default only the rolling median gates.
#
# The workflow runs only by hand (workflow_dispatch; the full matrix takes about 6 × 7 min). With
# the commented-out schedule enabled, a scheduled run picks one scenario per night by day of year
# (6 scenarios, so each one every 6 nights) with 3 repetitions.
name: Load tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Scenario (noop, state, runs, fanout, long-journal, overload) or "all"'
        required: true
        default: all
      repetitions:
        description: Repetitions per scenario
        required: true
        default: '3'
  # schedule:
  #   - cron: '17 2 * * *'

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  load:
    name: bin/load-test.sh ${{ inputs.scenario || 'rotation' }}
    runs-on: [self-hosted, restate-php-load]
    timeout-minutes: 120
    env:
      LOAD_RESULTS_DIR: ${{ vars.LOAD_RESULTS_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: restate-php
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Composer cache
        uses: ./.github/actions/composer-cache

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Choose the scenario
        id: scenario
        env:
          EVENT: ${{ github.event_name }}
          SCENARIO: ${{ inputs.scenario }}
        run: |
          scenarios=(noop state runs fanout long-journal overload)
          if [ "$EVENT" = schedule ]; then
            day=$((10#$(date -u +%j)))
            SCENARIO=${scenarios[$((day % ${#scenarios[@]}))]}
          fi
          echo "scenario=$SCENARIO" >> "$GITHUB_OUTPUT"
          echo "LOAD_RESULTS_DIR=${LOAD_RESULTS_DIR:-$HOME/restate-php-load-results}" >> "$GITHUB_ENV"
          mkdir -p var/load
          touch var/load/started

      - name: Run
        env:
          SCENARIO: ${{ steps.scenario.outputs.scenario }}
          REPETITIONS: ${{ inputs.repetitions || '3' }}
        run: bash bin/load-test.sh "$SCENARIO" --repetitions "$REPETITIONS" --gate

      - name: Collect this run's results
        if: always()
        run: |
          mkdir -p var/load/results-run
          find "$LOAD_RESULTS_DIR" -name '*.json' -newer var/load/started -exec cp {} var/load/results-run/ \;

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-results
          # Result files, k6 summaries and the endpoint's request logs (not the throwaway signing key).
          path: |
            var/load/results-run/
            var/load/work/*/k6-*
            var/load/work/*/*.log
          if-no-files-found: ignore
