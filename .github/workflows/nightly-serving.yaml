# Serving tests too slow or heavy for every pull request (TESTING.md, "Serving: large bodies,
# PHP-FPM and front-door hazards"): the large-bodies group on every server, the serving-hazards
# group (front doors at their defaults, front-door timeouts, clear_env), and the upstream Restate
# SDK test suite against php-fpm behind nginx. Each job runs the same command as locally.
name: Nightly serving

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  large-bodies:
    name: large bodies (${{ matrix.server }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: php-cli
            command: composer test:large-bodies
          - server: nginx-fpm
            command: just test fpm --group large-bodies
          - server: nginx-fpm-h2c
            command: just test fpm --group large-bodies
          - server: caddy-fpm
            command: just test fpm --group large-bodies

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: integration

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # RESTATE_PHP_TEST_REPORT_MEMORY prints each large case's peak RSS into the log.
      - name: Run the large-bodies group
        run: ${{ matrix.command }}
        env:
          RESTATE_PHP_TEST_SERVER: ${{ matrix.server }}
          RESTATE_PHP_TEST_REPORT_MEMORY: '1'

  serving-hazards:
    name: composer test:serving-hazards
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The host extension serves the suite's own php -S endpoints.
          cargo-cache: integration

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Builds the fpm-extension-apache image (php-fpm with nginx, Caddy and Apache) and runs the
      # serving-hazards group against it.
      - name: Test
        run: composer test:serving-hazards

  # upstream.yaml against php-fpm behind nginx. The action publishes the JUnit results as a check
  # run and looks for a pull request to comment on, which a scheduled or manual run on main never
  # has: upstream.yaml's job asks for these.
  upstream-fpm-nginx:
    name: Upstream SDK tests
    uses: ./.github/workflows/upstream.yaml
    with:
      target: upstream-fpm-nginx
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
