# Serving tests too slow or heavy for every pull request (TESTING.md, "Serving: large bodies,
# PHP-FPM and front-door hazards"): the large-bodies group on every server, the serving-hazards
# group (front doors at their defaults, front-door timeouts, clear_env). Each job runs the same
# command as locally.
name: Nightly serving

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The images' extension module is built by the runner's Nix (bin/build-image.sh), which downloads
  # it from restate-php.cachix.org for any source CI has built.
  RESTATE_PHP_IMAGE_EXTENSION: host

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  large-bodies:
    name: large bodies (${{ matrix.server }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        server: [php-cli, nginx-fpm, nginx-fpm-h2c, caddy-fpm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: integration

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # RESTATE_PHP_TEST_REPORT_MEMORY prints each large case's peak RSS into the log.
      - name: Run the large-bodies group
        run: just test integration ${{ matrix.server }} --group large-bodies
        env:
          RESTATE_PHP_TEST_REPORT_MEMORY: '1'

  serving-hazards:
    name: just test serving-hazards
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          # The host extension serves the suite's own php -S endpoints.
          cargo-cache: integration

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Builds the fpm-extension-apache image (php-fpm with nginx, Caddy and Apache) and runs the
      # serving-hazards group against it.
      - name: Test
        run: just test serving-hazards
