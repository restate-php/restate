# The PHP micro-benchmarks (tests/Benchmark, phpbench) of a pull request against its base, and a
# nightly A/A run of main against itself (TESTING.md, Performance). Both run
# bin/bench-compare.sh (composer bench:compare) in the dev shell, as a developer does locally.
#
# Not a gate: both jobs are continue-on-error, since wall-clock numbers on shared GitHub runners
# move by noise alone. The nightly A/A run compares identical code, so every delta in its report
# is noise; its report.json artifacts show how far the numbers move on these runners.
name: Benchmarks

on:
  pull_request:
    paths:
      - '.github/workflows/bench.yaml'
      - 'bin/bench-compare.sh'
      - 'justfile'
      - 'composer.json'
      - 'composer.lock'
      - 'extension/**'
      - 'packages/**'
      - 'phpbench.json'
      - 'tests/Benchmark/**'
      - 'tests/Support/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  compare:
    name: PHP benchmarks, head vs base
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The base revision is checked out as a worktree next to the head.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: restate-php
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Composer cache
        uses: ./.github/actions/composer-cache

      - name: Set up Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            extension/target/
          key: cargo-bench-${{ hashFiles('extension/Cargo.lock', 'extension/rust-toolchain.toml') }}
          restore-keys: |
            cargo-bench-
            cargo-check-php8.5-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Writes the comparison to the job summary; exits 1 when a benchmark regressed in both pairs.
      - name: Compare with the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash bin/bench-compare.sh --base "$BASE_SHA"

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-compare
          path: |
            var/bench/compare/*.xml
            var/bench/compare/*.tsv
            var/bench/compare/report.*
          if-no-files-found: ignore

  calibrate:
    name: PHP benchmarks, A/A calibration
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up devenv
        uses: sagikazarmark/setup-devenv@c36f9e57ca50ee1a6dad1a05a1a684e321f8096a # v0.3.0
        with:
          cachix-cache: restate-php
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Set up Composer cache
        uses: ./.github/actions/composer-cache

      - name: Set up Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            extension/target/
          key: cargo-bench-${{ hashFiles('extension/Cargo.lock', 'extension/rust-toolchain.toml') }}
          restore-keys: |
            cargo-bench-
            cargo-check-php8.5-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # The same code on both sides: every delta in the report is noise. A "regression" here
      # means the thresholds are too tight for this runner.
      - name: Compare with itself
        run: bash bin/bench-compare.sh --base HEAD

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-calibration-${{ github.run_id }}
          path: |
            var/bench/compare/*.xml
            var/bench/compare/*.tsv
            var/bench/compare/report.*
          retention-days: 90
          if-no-files-found: ignore
