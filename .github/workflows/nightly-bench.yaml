# The PHP micro-benchmarks (tests/Benchmark, phpbench): a nightly A/A run of main against itself
#
# Not a gate: the job is continue-on-error, since wall-clock numbers on shared GitHub runners
# move by noise alone. The run compares identical code, so every delta in its report
# is noise; its report.json artifacts show how far the numbers move on these runners.
name: Benchmarks (nightly)

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  php:
    name: PHP / A/A calibration
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: bench

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # The same code on both sides: every delta in the report is noise. A "regression" here
      # means the thresholds are too tight for this runner.
      - name: Compare with itself
        run: just bench-compare --base HEAD

      - name: Upload the comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-calibration-${{ github.run_id }}
          path: |
            var/bench/compare/*.xml
            var/bench/compare/*.tsv
            var/bench/compare/report.*
          retention-days: 90
          if-no-files-found: ignore

  extension:
    name: Extension / Instruction counts and wall-clock times
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          cargo-cache: bench-extension

      - name: Instruction counts
        run: |
          set -o pipefail
          just extension bench 2>&1 | tee bench-extension.log
          {
            echo '### Extension instruction counts'
            echo
            echo '```'
            grep -E '^vm_instructions::|^  Instructions:|instructions per replayed run' bench-extension.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Wall-clock times
        run: just extension bench-criterion

      - name: Upload the criterion report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: criterion-report
          path: extension/target/criterion/
