# The Docker quickstart (examples/quickstart): starts it with Docker Compose and runs every step of its
# walkthrough, so the README's first experience doesn't rot (tests/Quickstart). Locally: just test quickstart.
#
# - local: against this commit (the extension module built from it, the packages from packages/), on both CPUs
#   the prebuilt extension targets: x86_64 and arm64.
# - released: what users get (PIE and Packagist), nightly; skipped while no version is released.
name: Quickstart

on:
  push:
    branches: [main]
    paths: &paths
      - '.github/workflows/quickstart.yaml'
      - 'bin/build-image.sh'
      - 'docker-bake.hcl'
      - 'docker/Dockerfile'
      - 'docker/extension/**'
      - 'examples/quickstart/**'
      - 'extension/**'
      - 'packages/**'
      - 'tests/Quickstart/**'
      - 'tests/Integration/Support/Http*.php'
  pull_request:
    paths: *paths
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

# Pull requests cancel their earlier runs; on main a push never cancels the nightly run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The images' extension module is built by the runner's Nix (bin/build-image.sh), which downloads
  # it from restate-php.cachix.org for any source CI has built.
  RESTATE_PHP_IMAGE_EXTENSION: host

defaults:
  run:
    # Every step runs in the devenv shell, with the project's toolchain.
    shell: devenv shell -- bash -e {0}

jobs:
  local:
    name: local (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the dev shell
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Its Restate image is RestateContainer::DEFAULT_IMAGE (tests/Unit/Testing/RestateContainerTest.php
      # checks it).
      - name: Run the quickstart against this commit
        run: just test quickstart local

  released:
    name: released
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for a released version
        id: released
        shell: bash
        run: |
          if curl -fsS https://repo.packagist.org/p2/restate/sdk.json | grep -q '"version"'; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No version of restate/sdk is released yet; skipping the released quickstart"
          fi

      - name: Set up the dev shell
        if: steps.released.outputs.released == 'true'
        uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install dependencies
        if: steps.released.outputs.released == 'true'
        run: composer install --no-interaction --no-progress

      - name: Run the quickstart against the released extension and packages
        if: steps.released.outputs.released == 'true'
        run: just test quickstart released
