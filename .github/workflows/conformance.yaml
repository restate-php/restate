name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      target:
        description: The test services image, conformance-frankenphp or conformance-fpm-nginx (its PHP 8.4 debug image)
        type: string
        default: conformance-frankenphp

permissions:
  contents: read

env:
  TARGET: ${{ inputs.target || 'conformance-frankenphp' }}
  SERVICE_IMAGE: restate.local/restate-php-test-services:${{ inputs.target || 'conformance-frankenphp' }}

jobs:
  tests:
    name: Tests (${{ inputs.target || 'conformance-frankenphp' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The integration harness's Restate (RestateContainer::DEFAULT_IMAGE).
      - name: Read the Restate image
        run: |
          image=$(sed -n "s/^ *public const string DEFAULT_IMAGE = '\(.*\)';$/\1/p" packages/testing/src/RestateContainer.php)
          if [ -z "$image" ]; then
            echo "::error file=packages/testing/src/RestateContainer.php::No DEFAULT_IMAGE"
            exit 1
          fi
          echo "RESTATE_IMAGE=$image" >> "$GITHUB_ENV"

      # Plain Nix for the extension module (the flake, extension/flake.lock), without the dev shell:
      # restate-php.cachix.org has it for any source CI has built.
      - name: Install Nix
        uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0

      - name: Use the binary caches
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: restate-php
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Images tagged restate.local/* are never pulled by the suite, so it uses this build. The
      # module is built by the runner's Nix (RESTATE_PHP_IMAGE_EXTENSION=host).
      - name: Build the test-services image
        run: bash bin/build-image.sh "$TARGET" "$SERVICE_IMAGE"
        env:
          RESTATE_PHP_IMAGE_EXTENSION: host

      # Pinned by tag, not by commit: the action downloads sdk-tests.jar from the release named
      # after the ref it runs at (github.action_ref), so a SHA pin breaks the download. Restate
      # has moved the v2.3 tag after the release (the jar asset stayed the same); locally
      # bin/conformance-local.sh pins the jar by SHA-256.
      - name: Run the SDK conformance tests
        uses: restatedev/e2e/sdk-tests@v2.3
        with:
          serviceContainerImage: ${{ env.SERVICE_IMAGE }}
          restateContainerImage: ${{ env.RESTATE_IMAGE }}
          exclusionsFile: test-services/exclusions.yaml
          testArtifactOutput: ${{ env.TARGET }}-sdk-tests-report

      # A suite that cannot start (for example, no test matches) reports nothing and exits 0.
      - name: Fail when no tests ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          total = sum(int(ET.parse(f).getroot().get("tests", 0)) for f in glob.glob("test-report/*/*.xml"))
          print(f"{total} tests ran")
          sys.exit(0 if total > 0 else 1)
          PY
