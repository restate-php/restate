; PHP settings of the fpm-extension image, on top of php.ini-production (docs/serving.md, "PHP Settings").
; Installed as conf.d/zz-restate.ini, so it is read after the image's own conf.d files.

extension = restate

; PHP's messages go to php-fpm's log (the container output), never into a response.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; Restate's request bodies are journals: no $_POST parsing, so no post_max_size startup warning; the SDK reads
; php://input only.
enable_post_data_reading = 0

; Several copies of each body are in memory during an attempt.
memory_limit = 512M
; Above the slowest attempt of the integration suite.
max_execution_time = 300

; OPcache as in production. The repository is bind-mounted, so changed files must be seen at once.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.jit = disable
