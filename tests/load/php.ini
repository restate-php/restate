; PHP settings of the load-test endpoint (compose.yaml mounts them into its PHP configuration):
; production-like, OPcache on, JIT off, nothing printed into responses.
display_errors = Off
log_errors = On
zend.assertions = -1
enable_post_data_reading = 0
memory_limit = 256M
max_execution_time = 0
opcache.enable = 1
opcache.jit = disable
opcache.jit_buffer_size = 0
; The code is mounted and never changes during a run.
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
