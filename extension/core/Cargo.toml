[package]
name = "restate-php-core"
version = "0.1.0"
edition = "2021"
description = "The Restate PHP SDK's Rust core: every operation the PHP side performs on a restate-sdk-shared-core VM, without PHP."
license = "MIT"
authors = ["Márk Sági-Kazár <mark.sagikazar@gmail.com>"]
repository = "https://github.com/restate-php/restate"
publish = false

[dependencies]
bytes = "1.10"
# `request_identity`: the request identity verifier the official SDKs share
# (`identity`). It verifies with jsonwebtoken, whose crypto is `rust_crypto`
# (pure Rust, as in the TypeScript SDK; `aws_lc_rs` builds AWS-LC from C).
restate-sdk-shared-core = { version = "=8.7.2", features = ["sha2_random_seed", "request_identity", "rust_crypto"] }
# shared-core logs through it; `logs` captures its events. Already in the
# lockfile through shared-core.
tracing = "0.1"

[dev-dependencies]
# Signs the tokens tests/identity.rs verifies, with the provider shared-core
# selects. Already in the lockfile through shared-core.
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
# Encodes the protocol frames the VM tests feed and decodes what the VM writes
# (tests/vm/protocol.rs). Resolves to the prost shared-core already uses, so it
# adds no crate to the lockfile.
prost = "0.14"
# The claims tests/identity.rs signs. Already in the lockfile through shared-core.
serde_json = "1"
# Benchmarks of the core (TESTING.md, Performance): `vm` (criterion, wall clock)
# and `vm_instructions` (gungraun, callgrind instruction counts). Both need the
# `bench` feature, so `composer check:extension` (clippy --all-targets, cargo
# test) never compiles them; `just extension bench` and the bench-extension
# workflow build and lint them with it.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# Exactly the version of the gungraun-runner binary `just extension bench`
# installs: the library and the runner must match.
gungraun = "=0.20.0"

[features]
bench = []

[[bench]]
name = "vm"
harness = false
required-features = ["bench"]

[[bench]]
name = "vm_instructions"
harness = false
required-features = ["bench"]
