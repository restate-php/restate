# The Rust toolchain for the crates in extension/. The dev shell builds it from
# this file (devenv.nix `languages.rust.toolchainFile`), and so do the Nix
# builds (flake.nix, `fromRustupToolchainFile`), the Docker images' module
# included (extension/Dockerfile); a rustup installation reads it too. Bump the
# version here, and nowhere else.
[toolchain]
channel = "1.95.0"
profile = "minimal"
components = ["clippy", "rustfmt"]
